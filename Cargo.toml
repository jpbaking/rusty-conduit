[package]
name = "rusty-conduit"
version = "1.4.0"
edition = "2021"
description = "Lightweight cross-platform HTTP/HTTPS and SOCKS4/4a/5 proxy server with optional HTTPS MITM inspection"
license = "BSD-3-Clause"

[lib]
name = "rusty_conduit"
path = "src/lib.rs"

[[bin]]
name = "rusty-conduit"
path = "src/main.rs"

[dependencies]
# Shared proxy engine (listeners, mux, HTTP/SOCKS, MITM, filter, logging); its modules are
# re-exported from the crate root. `default-features = false` drops the regex-based
# `routing` feature: rusty-conduit always routes `direct` with no rules.
rusty-conduit-engine = { git = "https://github.com/jpbaking/rusty-conduit-engine", tag = "v0.3.0", default-features = false }

# Async runtime & utilities
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "fs", "io-std"] }

# CLI & configuration
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
humantime = "2"

# Errors
thiserror = "2"

[dev-dependencies]
# Integration-test fixtures (origin servers, MITM/TLS clients, CA generation). The engine
# owns the runtime HTTP/TLS stack; these stay pure-Rust (`ring` provider, no OpenSSL / aws-lc).
tokio-util = { version = "0.7", features = ["rt"] }
bytes = "1"
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"
http-body-util = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
p12-keystore = "0.4"
x509-parser = "0.18"
serde_json = "1"
time = { version = "0.3", features = ["formatting", "macros"] }
# `all` exposes the keepalive getters used to verify socket options in tests.
socket2 = { version = "0.6", features = ["all"] }
